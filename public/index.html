<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Markeltoys</title>
    <!-- "Добавить на экран Домой" на iPhone/Android: без этого ссылка на
         приложение открывалась только как обычная вкладка браузера или
         внутри чужого in-app-браузера (Telegram/WhatsApp) — оба варианта
         на iOS Safari подвержены агрессивной очистке localStorage/сессии
         через несколько дней без визита (жалоба Марка 21.08 — разлогинивает
         "если не заходил день-два"). С этими тегами ссылку можно закрепить
         как отдельную иконку — Safari даёт установленным так страницам
         более стабильное хранилище, чем обычной вкладке или чужому
         in-app-браузеру. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Markeltoys" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#E04E28" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* 100% на мобильных браузерах (Safari/Telegram in-app) считается от
           "большого" viewport — без учёта показанного тулбара браузера,
           из-за чего нижний таб-бар приложения уезжает под тулбар.
           100dvh пересчитывается под реально видимую область; строка ниже
           игнорируется браузерами без поддержки dvh, оставляя 100% как fallback. */
        height: 100dvh;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
